[workspace]
resolver = "3"
members = [
    "crates/opensesh-core",
    "crates/opensesh-term",
    "crates/opensesh-import",
    "crates/opensesh-vault",
    "crates/opensesh-ssh",
    "crates/opensesh-proto-misc",
    "crates/opensesh-s3",
    "crates/opensesh-rdp-protocol",
    "crates/opensesh-cli",
    "crates/opensesh-app",
    "xtask",
]
default-members = [
    "crates/opensesh-core",
    "crates/opensesh-term",
    "crates/opensesh-import",
    "crates/opensesh-vault",
    "crates/opensesh-ssh",
    "crates/opensesh-proto-misc",
    "crates/opensesh-s3",
    "crates/opensesh-rdp-protocol",
    "crates/opensesh-cli",
    "crates/opensesh-app",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
# MSRV: see docs/adr/0002-toolchain-and-msrv.md. Keep in sync with rust-toolchain.toml.
rust-version = "1.89"
license = "GPL-3.0-or-later"
authors = ["OpenSesh contributors"]
homepage = "https://github.com/caixax/opensesh"
repository = "https://github.com/caixax/opensesh"
publish = false

# Every third-party version is pinned here (verified on crates.io on 2026-09-25) and locked
# further by the committed Cargo.lock. Member crates only use `{ workspace = true }`.
[workspace.dependencies]
# Internal crates
opensesh-core = { path = "crates/opensesh-core" }
opensesh-import = { path = "crates/opensesh-import" }
opensesh-term = { path = "crates/opensesh-term" }
opensesh-vault = { path = "crates/opensesh-vault" }
opensesh-ssh = { path = "crates/opensesh-ssh" }
opensesh-proto-misc = { path = "crates/opensesh-proto-misc" }
opensesh-s3 = { path = "crates/opensesh-s3" }
opensesh-rdp-protocol = { path = "crates/opensesh-rdp-protocol" }

# Qt bridge (KDAB cxx-qt)
cxx = "1.0.202"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", default-features = false }
cxx-qt-build = "0.10.0"

# Terminal (Sprint 2, ADR 0012). alacritty_terminal: caret pin so `cargo update` can pick up
# 0.26.x fixes (the zero-width cap); `serde` isn't needed. Its `vte` re-export is used, not a
# separate vte dependency.
alacritty_terminal = { version = "0.26.0", default-features = false }
crossbeam-channel = "0.5.17"
portable-pty = "0.9.0"
# Unix only (opensesh-term): IUTF8, poll with a wake pipe, process-group signals.
rustix = { version = "1.1.5", default-features = false, features = ["std", "termios", "event", "pipe", "process"] }

# Errors
anyhow = "1.0.104"
thiserror = "2.0.21"

# Logging
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false }

# Config and platform
directories = "6.0.0"
# Terminal encodings other than UTF-8 (Sprint 3, opensesh-term).
encoding_rs = "0.8.42"
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
# iTerm2 `.itermcolors` theme import (an XML property list; opensesh-core).
quick-xml = "0.42.0"

# Hosts (Sprint 5, opensesh-core). nucleo-matcher is the matcher of `nucleo` (PLAN §2) without
# its background worker (ADR 0019); ulid gives host and group ids.
nucleo-matcher = "0.3.1"
ulid = "3.0.0"
# One running instance and the `opensesh` CLI: local sockets (ADR 0021).
interprocess = "2.4.4"

# Vault, identities and SSH keys (Sprint 6, opensesh-vault; ADR 0024). The RustCrypto crates
# follow the generation of ssh-key 0.6 (rand_core 0.6, digest 0.10, cipher 0.4), so one copy of
# each primitive is linked; `ssh_key::sha2` is its SHA-2.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
secrecy = "0.10.3"
zeroize = "1.9.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "p521", "rsa", "encryption", "getrandom"] }
ssh-encoding = "0.2.0"
base64ct = { version = "1.8.3", features = ["alloc"] }
# PuTTY .ppk keys (v2: SHA-1 and HMAC-SHA-1; v3: Argon2 and HMAC-SHA-256; both AES-256-CBC).
aes = "0.8.4"
cbc = "0.1.2"
hmac = "0.12.1"
sha1 = "0.10.7"
# The system keyring: Credential Manager on Windows, Secret Service on Linux (ADR 0023).
keyring = "4.2.0"

# SSH client (Sprint 7, opensesh-ssh; ADR 0027). `ring` instead of the default `aws-lc-rs`, which
# needs NASM or CMake on some platforms; `des` for the legacy 3des-cbc cipher. 0.63.3 needs Rust
# 1.89 (ADR 0026).
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2", "rsa", "des"] }
# SFTP over a channel of the SSH connection, client and (for tests) server (Sprint 8, ADR 0028).
russh-sftp = "3.0.0"
# Pageant on Windows (named pipe or WM_COPYDATA), the agent russh itself uses; signing only.
pageant = "0.2.3"
# The async runtime of the SSH client, off the GUI thread (PLAN §2).
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process", "fs"] }

# xtask only (regex is also used by opensesh-term)
flate2 = "1.1.10"
regex = "1.13.1"
sha2 = "0.11.0"
tar = "0.4.46"
ureq = "3.4.2"
# Exact pin: zip may raise its MSRV (1.88 today) in any minor release. Reading deflate entries is
# all `cargo xtask fonts` needs.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The Windows icon (`cargo xtask icons`): the composed app logo rendered at each size and packed as
# an .ico. resvg without its default features (text, raster images): the logo is plain shapes.
resvg = { version = "0.48.1", default-features = false }
ico = "0.5.0"

# Serial ports (Sprint 12, opensesh-proto-misc). Without the default `libudev` feature: ports are
# found in /sys/class/tty on Linux, so the packages don't build against libudev.
serialport = { version = "4.10.1", default-features = false }

# S3 (Sprint 12, opensesh-s3; ADR 0033). 1.122.0 is the newest that builds with Rust 1.89. Without
# its default features: no `aws-lc` TLS (CMake and NASM on Windows), no default HTTPS client and
# no sigv4a. The HTTP client is aws-smithy-http-client's, with rustls on `ring`.
aws-sdk-s3 = { version = "1.122.0", default-features = false, features = ["rt-tokio", "http-1x"] }
aws-smithy-http-client = { version = "1.1.9", default-features = false, features = ["rustls-ring"] }
# The in-process S3 server of tests and the smoke test (opensesh-s3's `testing`): hyper's HTTP/1
# server, the versions the SDK's client already brings.
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }

# Windows only (opensesh-app: console attach and error message box)
windows-sys = "0.61.2"
# The icon and version information inside OpenSesh.exe (opensesh-app's build script).
embed-resource = "3.0.11"

# Tests
tempfile = "3.27.0"
# A stream of connections for russh's agent server in the SSH tests.
futures = "0.3.34"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# PLAN §0 rule 10: no unwrap()/expect() in production code (tests are allowed via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"

# Debug builds and tests: unoptimized, generating an RSA-4096 key takes over a minute and
# Argon2 seconds. Optimizing the arithmetic crates alone brings them to release speed.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.bcrypt-pbkdf]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
