# Bundled Windows pseudoconsole host (ADR 0014). Consumed by `cargo xtask conpty`.
#
# The NuGet package below is downloaded over HTTPS and its sha256 is verified before it is opened.
# The listed files are extracted byte for byte (each one is checked against its own sha256) into
# target/xtask-cache/ and copied next to the app executables (target/debug, target/release, or
# the --dest folder). portable-pty then loads this conpty.dll, which starts this OpenConsole.exe;
# without them the app falls back to the ConPTY built into Windows.
#
# The package ships no license file, so the text comes from the microsoft/terminal release tag
# the package was published with (the same GitHub release carries this nupkg). It is copied to
# assets/conpty/<license_output> with LF line endings, and THIRD_PARTY_NOTICES.md is regenerated.
schema_version = 1

[package]
id = "Microsoft.Windows.Console.ConPTY"
version = "1.24.260710001"
# NuGet V3 package content (flat container) endpoint: served directly, without redirects.
url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.console.conpty/1.24.260710001/microsoft.windows.console.conpty.1.24.260710001.nupkg"
sha256 = "175640566a3b59c4b132070ee96c2c77e5ab7edd2e92732a5eb3610bbf63d90e"
license = "MIT"
license_url = "https://raw.githubusercontent.com/microsoft/terminal/v1.24.11911.0/LICENSE"
license_sha256 = "5d177f23ecfeb0ea8e050b6a5a16355e1ae9a0b286436ca8f83ed08b3795be6b"
license_output = "LICENSE-MIT.txt"
homepage = "https://github.com/microsoft/terminal"

# x64 only: the app is built for x86_64-pc-windows-msvc. The package also has x86 and arm64.
# "<entry in the nupkg>" = { output = "<file name next to the exe>", sha256 = "<of the file>" }
[files]
"runtimes/win-x64/native/conpty.dll" = { output = "conpty.dll", sha256 = "39fba2713e2495117b1591ae8c32a3b904bea7aa66069cf7815e2844c76d75d8" }
"build/native/runtimes/x64/OpenConsole.exe" = { output = "OpenConsole.exe", sha256 = "b7fd936c2668b87b9ecf7b3366dc6568afc1c6f981874cba3e955a1c35cf8160" }
