# Terminal color themes bundled with OpenSesh (PLAN §6.3, ADR 0016). The upstream files are
# kept unmodified in upstream/ (fetched at the pinned commits) and read by the Alacritty
# importer at start-up; OpenSesh Dark and Light are OpenSesh's own (opensesh-dark.toml,
# opensesh-light.toml). THIRD_PARTY_NOTICES.md is generated from this file (cargo xtask notices).
schema_version = 1

[[source]]
name = "Catppuccin for Alacritty"
repository = "https://github.com/catppuccin/alacritty"
commit = "f6cb5a5c2b404cdaceaff193b9c52317f62c62f7"
license = "MIT"
license_files = ["LICENSES/catppuccin-MIT.txt"]
files = ["catppuccin-mocha.toml", "catppuccin-macchiato.toml", "catppuccin-frappe.toml", "catppuccin-latte.toml"]

