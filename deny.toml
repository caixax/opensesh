# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/), checked in CI.
# Written for cargo-deny 0.20. Run locally with `cargo deny check`.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
# RustSec advisories (the same database cargo-audit uses).
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # rsa (through ssh-key and russh), the Marvin timing attack: no fixed version exists. The
    # vault uses RSA locally; the SSH client signs with RSA keys but never decrypts, one
    # signature per connection, and agents sign outside OpenSesh (ADR 0024, ADR 0027). Reviewed
    # each sprint.
    { id = "RUSTSEC-2023-0071", reason = "RSA signs only, once per connection; no fixed release (ADR 0027)" },
    # crypto-bigint 0.5.5 (through ssh-key 0.6 and elliptic-curve 0.13): operations meant to be
    # constant-time could branch on secrets. 0.5 has no fixed release; the fixed 0.7 is the one
    # russh signs with. The vault uses ssh-key 0.6 only to generate, read and convert keys on
    # this computer, never to sign (ADR 0024). Until ssh-key 0.7 is stable.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only, for local key generation and conversion; no fixed 0.5 release (ADR 0024)" },
]

[licenses]
# Allowlist of licenses compatible with GPL-3.0-or-later (ADR 0001). Anything else fails CI
# and needs a review before being added here.
allow = [
    # Zero-clause BSD: no conditions at all (interprocess's recvmsg and doctest-file, ADR 0021).
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Two-clause BSD: permissive (arrayref, through resvg's tiny-skia; xtask only, for the Windows
    # icon, so nothing of it ships).
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Our own crates are GPL-3.0-or-later and `publish = false`; they don't need to be allowlisted.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
