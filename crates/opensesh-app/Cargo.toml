[package]
name = "opensesh-app"
description = "OpenSesh desktop application (Qt 6 / QML through cxx-qt)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "opensesh-app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib = { workspace = true, features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
opensesh-core.workspace = true
opensesh-term.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
